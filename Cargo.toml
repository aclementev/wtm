[package]
name = "wtm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A git worktree manager for very large repositories"
repository = "https://github.com/aclementev/wtm"
license = "MIT"

[lib]
name = "wtm"
path = "src/lib.rs"

[[bin]]
name = "wtm"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
insta = "1"
predicates = "3"
proptest = "1"
